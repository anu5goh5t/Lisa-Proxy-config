# Lisa Proxy - shared Shadowrocket routing config
# Version: 0.2.0-test
# Public file: routing and DNS rules only. No UUID, SUB ID, subscription URL, or server credentials.
#
# Before use:
# 1. Import your own 3X-UI standard SUB subscription in Shadowrocket.
# 2. Rename that subscription entry to exactly: Lisa-Proxy
# 3. Import this file as a Remote Config and choose "Use Config".
# 4. Set Home > Global Routing to Config.
#
# Every user uses the same config URL but keeps their own private SUB subscription.

[General]
# Default/non-DIRECT DNS: Cloudflare DoH sent through the selected proxy.
dns-server = https://cloudflare-dns.com/dns-query#proxy
# Domains explicitly routed DIRECT: DNSPod DoH, resolved directly.
direct-dns-server = https://doh.pub/dns-query
# Resolve the VPS node hostname before a proxy tunnel is established.
proxy-dns-server = https://doh.pub/dns-query
# If the primary DNS path fails, keep fallback encrypted and proxy-routed.
fallback-dns-server = https://cloudflare-dns.com/dns-query#proxy
dns-fallback-system = false
dns-direct-system = false
dns-direct-fallback-proxy = false
ipv6 = false
prefer-ipv6 = false
private-ip-answer = true
# Intercept apps that hard-code Google's public DNS.
hijack-dns = 8.8.8.8:53,8.8.4.4:53

[Proxy Group]
# "Lisa-Proxy" is the local subscription display name in Shadowrocket.
# Each user imports their own private SUB URL and gives that entry this same name.
🚀 节点选择 = select,Lisa-Proxy,use=true,select=0
🍎 苹果服务 = select,DIRECT,🚀 节点选择,select=0
Ⓜ️ 微软服务 = select,DIRECT,🚀 节点选择,select=0
📲 电报消息 = select,🚀 节点选择,DIRECT,select=0
🚫 广告拦截 = select,REJECT,DIRECT,select=0

[Rule]
# Private/local networks
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve

# Apple service IPs and domains
IP-CIDR,17.0.0.0/8,🍎 苹果服务,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,🍎 苹果服务
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/iCloud/iCloud.list,🍎 苹果服务

# Tracker / torrent direct
DOMAIN-KEYWORD,tracker,DIRECT
DOMAIN-KEYWORD,torrent,DIRECT

# Advertising block
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/AdvertisingLite/AdvertisingLite.list,🚫 广告拦截

# Steam downloads direct; Steam storefront/community proxied
DOMAIN-SUFFIX,steamcontent.com,DIRECT
DOMAIN-SUFFIX,steampipe.akamaized.net,DIRECT
DOMAIN-SUFFIX,steam-content-dnld-1.apac-1-cdn.cqloud.com,DIRECT
DOMAIN-SUFFIX,steampowered.com,🚀 节点选择
DOMAIN-SUFFIX,steamcommunity.com,🚀 节点选择
DOMAIN-SUFFIX,steam-chat.com,🚀 节点选择

# Microsoft services
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Microsoft/Microsoft.list,Ⓜ️ 微软服务

# Google / Telegram
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Google/Google.list,🚀 节点选择
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Telegram/Telegram.list,📲 电报消息

# China domains direct BEFORE the generic proxy list
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China.list,DIRECT

# Generic international domains
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Proxy/Proxy.list,🚀 节点选择

# Default: proxy anything not matched above
FINAL,🚀 节点选择
